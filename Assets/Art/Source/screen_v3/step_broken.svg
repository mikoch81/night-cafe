  <path d="M104 36 h26 l-3 5 h-24 z" fill="#9a6a3c" stroke="#2b1a12" stroke-width="1.6" />
  <path d="M150 14 h40 l2 8 h-44 z" fill="#9a6a3c" stroke="#2b1a12" stroke-width="2.2" transform="rotate(-22 170 20)"/>
